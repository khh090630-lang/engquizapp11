<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 영어 문제 은행</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: #e0f8ff; padding: 40px 20px; margin: 0; min-height: 100vh; }
        .container { max-width: 1050px; margin: 0 auto; }
        .card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(16px); padding: 30px; border-radius: 20px; margin-bottom: 25px; border: 1px solid rgba(255, 255, 255, 0.1); }
        h2 { margin-top: 0; font-weight: 800; background: linear-gradient(to right, #6ee7b7, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 15px; }
        input[type="text"], input[type="number"], textarea, select { width: 100%; box-sizing: border-box; background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(0, 242, 254, 0.3); color: #e0f8ff; padding: 12px; border-radius: 8px; margin-bottom: 15px; font-family: inherit; font-size: 14px; font-weight: bold; }
        select { min-width: 120px; } select option { background: #1e293b; color: #e0f8ff; }
        input:focus, textarea:focus, select:focus { outline: none; border-color: #00f2fe; background: rgba(15, 23, 42, 0.8); }
        button { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: bold; white-space: nowrap; flex-shrink: 0; }
        button:hover { transform: translateY(-2px); }
        .btn-create { width: 100%; background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%); }
        .btn-outline { background: rgba(0, 242, 254, 0.1); color: #00f2fe; border: 1px solid #00f2fe; box-shadow: none; }
        .btn-outline:hover { background: rgba(0, 242, 254, 0.2); }
        
        .flex-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
        .flex-1 { flex: 1; min-width: 250px;}
        
        .batch-control { display: flex; flex-wrap: wrap; gap: 15px; align-items: center; background: rgba(0, 242, 254, 0.05); padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid rgba(0,242,254,0.1);}
        .batch-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        
        .passage-row { display: grid; grid-template-columns: 30px 1fr 250px 110px; align-items: center; padding: 15px; border-bottom: 1px solid rgba(0,242,254,0.1); gap: 15px; background: rgba(0,0,0,0.15); transition: transform 0.2s ease; }
        .header-row { background: rgba(0, 0, 0, 0.4); font-weight: bold; border-radius: 12px 12px 0 0; border: none; margin-top: 15px; }
        
        .passage-title { font-size: 15px; font-weight: 600; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; cursor: pointer; transition: color 0.2s ease; }
        .passage-title:hover { color: #00f2fe; text-decoration: underline; }
        
        .input-group { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; width: 100%;}
        .mode-count { display: flex; gap: 4px; width: 100%; justify-content: flex-end; }
        .mode-all { display: none; gap: 4px; width: 100%; justify-content: flex-end; padding-right: 5px; }
        .mode-count input { width: 45px; padding: 6px; margin: 0; text-align: center; }
        .mode-all input[type="checkbox"] { width: 45px; height: 18px; margin: 0; cursor: pointer; }

        .btn-group { display: flex; gap: 6px; }
        .btn-sm { padding: 8px; font-size: 13px; border-radius: 6px; flex: 1;}
        .btn-edit { background: linear-gradient(135deg, #f6d365 0%, #fda085 100%); color: #333; }
        .btn-del { background: linear-gradient(135deg, #f5576c 0%, #f093fb 100%); }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .modal-box { width: 100%; max-width: 750px; }
        .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 10px; }
        .btn-cancel { background: transparent; border: 1px solid #00f2fe; color: #00f2fe; }

        .folder-header { background: rgba(0,0,0,0.4); padding: 12px 15px; margin-top: 15px; border-radius: 8px 8px 0 0; color: #6ee7b7; font-weight: bold; border: 1px solid rgba(0,242,254,0.1); border-bottom: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: background 0.2s ease; }
        .folder-header:hover { background: rgba(0, 0, 0, 0.6); }
        .folder-content { display: block; }
        .toggle-icon { font-size: 12px; transition: transform 0.3s ease; }
        .folder-header.collapsed .toggle-icon { transform: rotate(-90deg); }

        /* 서술형 하이라이트 패널 CSS */
        .highlight-box { display: flex; flex-direction: column; gap: 6px; margin-top: 5px; margin-bottom: 15px; max-height: 250px; overflow-y: auto; padding: 12px; background: rgba(0,0,0,0.2); border-radius: 8px; border: 1px solid rgba(234, 179, 8, 0.3); }
        .highlight-item { padding: 10px; border-radius: 6px; background: rgba(255,255,255,0.05); cursor: pointer; font-size: 14px; line-height: 1.5; transition: all 0.2s; border: 1px solid transparent; }
        .highlight-item:hover { background: rgba(255,255,255,0.1); }
        .highlight-item.active { background: rgba(234, 179, 8, 0.2); border-color: #eab308; color: #fde047; font-weight: bold; }

        #quiz-output { padding: 40px; background: white; color: black; border-radius: 12px; display: none; margin-top: 30px; font-family: 'Batang', 'Malgun Gothic', serif; width: 100%; max-width: 800px; margin-left: auto; margin-right: auto; box-sizing: border-box; }
        #quiz-output * { color: #000; text-shadow: none !important; box-sizing: border-box; }
        .main-title { text-align: center; font-size: 22px; font-weight: 800; margin-top: 0; margin-bottom: 30px; letter-spacing: 1.5px; }
        .exam-paper { display: block; width: 100%; }
        .q-box { display: block; width: 100%; break-inside: avoid; page-break-inside: avoid; margin-bottom: 45px; padding-bottom: 10px; font-size: 13.5px; line-height: 1.6; }
        .q-title { font-weight: bold; font-size: 14.5px; display: block; margin-bottom: 6px; color: #000; }
        .q-direction { margin: 0 0 10px 0; font-size: 13.5px; color: #111; }
        .box-content { border: 1px solid #000; padding: 12px 15px; margin: 15px 0; background: #fff; text-align: justify; font-size: 14px; font-weight: normal; }
        .q-text { text-align: justify; margin-top: 10px; word-break: keep-all; }

        .interactive-input { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; background: #f1f5f9; padding: 12px; border-radius: 8px; }
        .interactive-input input { background: #fff; color: #0f172a; border: 1px solid #cbd5e1; border-radius: 6px; width: 100%; padding: 10px; box-sizing: border-box; font-family: inherit; font-size: 14px; font-weight: normal; }
        .interactive-input button { background: #2563eb; color: white; padding: 10px 20px; border-radius: 6px; font-size: 14px; cursor: pointer; border:none; width: 120px; align-self: flex-end;}
        .result-mark { font-weight: bold; font-size: 14px; margin-top: 5px; display: block; text-align: right; }

        @media print {
            .interactive-input { background: transparent !important; padding: 0 !important; border: none !important; }
            .interactive-input button, .result-mark { display: none !important; }
            .interactive-input input { border: none !important; border-bottom: 1px solid #333 !important; background: transparent !important; color: transparent !important; border-radius: 0 !important; padding: 5px 0 !important; margin-top: 15px !important; }
            .interactive-input input::placeholder { color: transparent !important; }
        }

        .admin-only { display: none !important; }
        body.admin-mode .admin-only-block { display: block !important; }
        body.admin-mode .admin-only-flex { display: flex !important; }
        body.admin-mode .admin-only-inline { display: inline-block !important; }
        body.admin-mode .passage-row { grid-template-columns: 30px 1fr 250px 110px 40px; }
        body.admin-mode .header-row { grid-template-columns: 30px 1fr 250px 110px 40px; }

        .admin-trigger { position: fixed; bottom: 20px; right: 20px; background: transparent; border: none; font-size: 24px; opacity: 0.05; cursor: pointer; z-index: 9999; transition: opacity 0.3s ease, transform 0.3s ease; }
        .admin-trigger:hover { opacity: 0.8; transform: rotate(90deg); }
        .move-btn-group { display: flex; flex-direction: column; gap: 2px; }
        .btn-move { background: rgba(255,255,255,0.1); border: none; color: #a5f3fc; padding: 2px; border-radius: 4px; cursor: pointer; font-size: 10px; }
        .btn-move:hover { background: rgba(0,242,254,0.3); }

        @media screen and (max-width: 820px) {
            body { padding: 15px 10px; }
            .card { padding: 20px 15px; margin-bottom: 15px; }
            .batch-control { flex-direction: column; align-items: stretch; gap: 15px; padding: 15px; }
            .batch-group { flex-direction: row; justify-content: space-between; width: 100%; gap: 10px;}
            .batch-group span { width: 100%; display: block; margin-bottom: 5px; } 
            .batch-group input[type="number"], .batch-group select { flex: 1; margin: 0 !important; min-width: 60px; }
            .batch-group button { flex: 1; }
            .divider-line, .hide-on-mobile { display: none !important; }
            .passage-row, body.admin-mode .passage-row { grid-template-columns: 30px 1fr 30px; gap: 10px; padding: 12px; }
            .passage-title { white-space: normal; word-break: break-word; font-size: 14px; grid-column: 2 / 3; }
            .input-group { grid-column: 1 / 4; justify-content: flex-start; background: rgba(0, 0, 0, 0.2); padding: 10px; border-radius: 8px; flex-wrap: wrap;}
            .mode-count input { width: 45px;}
            body.admin-mode .input-group { grid-column: 1 / 4; }
            .btn-group { grid-column: 1 / 4; width: 100%; }
            body.admin-mode .btn-group { grid-column: 1 / 4; }
            .btn-sm { padding: 10px; font-size: 14px; } 
            .move-btn-group { grid-column: 3 / 4; grid-row: 1 / 2; }
            .modal-box { width: 95%; padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 등록 구역 -->
        <div class="card admin-only admin-only-block">
            <h2>✨ 1. 새로운 지문 데이터 등록</h2>
            <p style="font-size: 13px; color: #94a3b8; margin-bottom: 15px;">해석본을 비워두면, 서술형 문제 출제 시 AI가 자동으로 번역하여 저장합니다.</p>
            <div style="display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap;">
                <select id="folder" style="margin-bottom: 0; flex: 1; min-width: 120px;">
                    <option value="미분류">미분류</option>
                </select>
                <button class="btn-outline" onclick="createNewFolder()" style="width: auto;">+ 새 폴더</button>
            </div>
            
            <input type="text" id="title" placeholder="지문 제목 (예: 24년 3월 고2 31번)">
            
            <div class="flex-row">
                <textarea id="content" class="flex-1" rows="5" placeholder="영어 지문 입력 (엔터로 문장 구분)"></textarea>
                <textarea id="translation" class="flex-1" rows="5" placeholder="한국어 해석 입력 (생략 시 자동 생성)"></textarea>
            </div>

            <button class="btn-outline" style="width:100%; margin-bottom:15px; border-color:#eab308; color:#eab308;" onclick="buildHighlightPreview('content', 'highlight-preview')">⭐ 서술형 빈출 문장 지정하기 패널 열기 (선택)</button>
            <div id="highlight-preview" class="highlight-box" style="display:none;"></div>

            <button id="save-btn" onclick="saveToDB()" style="width: 100%;">DB에 업로드하기</button>
        </div>

        <div class="card">
            <h2>🎯 지문 목록 및 문제지 출력</h2>
            
            <div class="batch-control">
                <div class="batch-group" style="width:100%; justify-content: flex-start; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px;">
                    <span style="font-weight:bold; color:#a5f3fc;">🛠️ 출제 모드 선택:</span>
                    <label style="cursor:pointer; margin-right:15px; display:flex; align-items:center; gap:5px;">
                        <input type="radio" name="output_mode" value="count" checked onchange="toggleOutputMode()"> 🔢 문항 수 지정
                    </label>
                    <label style="cursor:pointer; margin-right:15px; display:flex; align-items:center; gap:5px;">
                        <input type="radio" name="output_mode" value="all" onchange="toggleOutputMode()"> ☑️ 지문 전체 문장
                    </label>
                    <label style="cursor:pointer; display:flex; align-items:center; gap:5px; color:#fde047; font-weight:bold;">
                        <input type="checkbox" id="only-highlight-gen"> ⭐ 빈출 문장만 서술형 출제
                    </label>
                </div>

                <div id="batch-count-panel" class="batch-group" style="width:100%; justify-content: flex-start;">
                    <span style="font-weight:bold; color:#a5f3fc;">⚡ 일괄 적용:</span>
                    <input type="number" id="global-order" placeholder="순서" value="1" title="순서 배열">
                    <input type="number" id="global-insert" placeholder="삽입" value="1" title="문장 삽입">
                    <input type="number" id="global-desc1" placeholder="단어배열" value="0" title="서술형: 단어 배열">
                    <input type="number" id="global-desc2" placeholder="어형변형" value="0" title="서술형: 어형 변형 영작">
                    <input type="number" id="global-desc3" placeholder="통문장" value="0" title="서술형: 통문장 영작">
                    <button class="btn-outline" onclick="applyGlobalCount()">적용</button>
                </div>

                <div id="batch-all-panel" class="batch-group" style="width:100%; justify-content: flex-start; display:none;">
                    <span style="font-weight:bold; color:#a5f3fc;">⚡ 일괄 체크(ALL):</span>
                    <label style="margin-left:5px;"><input type="checkbox" id="global-order-all"> 순서</label>
                    <label style="margin-left:5px;"><input type="checkbox" id="global-insert-all"> 삽입</label>
                    <label style="margin-left:5px;"><input type="checkbox" id="global-desc1-all"> 단어배열</label>
                    <label style="margin-left:5px;"><input type="checkbox" id="global-desc2-all"> 어형변형</label>
                    <label style="margin-left:5px;"><input type="checkbox" id="global-desc3-all"> 통문장</label>
                    <button class="btn-outline" onclick="applyGlobalAll()">체크 적용</button>
                </div>
                
                <div class="divider-line admin-only admin-only-block" style="width: 1px; height: 30px; background: rgba(0,242,254,0.2); margin: 0 5px;"></div>
                
                <div class="batch-group admin-only admin-only-flex">
                    <span style="font-weight:bold; color:#a5f3fc;">📁 선택지문 폴더이동:</span>
                    <select id="bulk-folder">
                        <option value="미분류">미분류</option>
                    </select>
                    <button class="btn-outline" onclick="moveSelectedToFolder()">이동</button>
                </div>
                <button id="save-order-btn" class="btn-outline admin-only admin-only-block" onclick="saveCurrentOrder()" style="background: rgba(110, 231, 183, 0.1); color: #6ee7b7; border-color: #6ee7b7; margin-left: auto; margin-top:10px;">📁 현재 순서 DB에 고정</button>
            </div>
            
            <div class="passage-row header-row" style="margin-top:0;">
                <input type="checkbox" id="select-all" onclick="toggleSelectAll()">
                <span>전체 선택 (목록)</span>
                <span class="hide-on-mobile" style="text-align:right; font-size:12px;">[순서/삽입/단어배열/어형변형/통문장]</span>
                <span class="hide-on-mobile admin-only admin-only-inline" style="text-align:center;">관리</span>
                <span class="hide-on-mobile admin-only admin-only-inline" style="text-align:center;">이동</span>
            </div>
            
            <div id="passage-list">
                <p style="text-align:center; padding:20px; color:#a5f3fc; font-weight:bold;">서버 대기 중...</p>
            </div>
            
            <input type="text" id="custom-main-title" placeholder="출력될 문제지 제목 (미입력 시 '영어 지문 변형 문제')" style="margin-top: 25px; margin-bottom: 10px;">
            <button id="gen-btn" onclick="generateIntegratedQuiz()" class="btn-create">🚀 선택한 지문으로 문제지 생성</button>
        </div>

        <div id="quiz-output"></div>
        <button id="pdf-btn" onclick="downloadPDF()" style="display: none; width:100%; margin-top:20px; background: linear-gradient(135deg, #ff0844 0%, #ffb199 100%); border:none; color:white;">
            📄 완성된 문제지 PDF 다운로드
        </button>
    </div>

    <button class="admin-trigger" onclick="toggleAdminMode()" title="관리자 모드">⚙️</button>

    <!-- 수정 모달 -->
    <div class="modal-overlay" id="edit-modal">
        <div class="card modal-box" style="max-width: 800px;">
            <h2>✏️ 저장된 지문 수정하기</h2>
            <input type="hidden" id="edit-id">
            
            <div style="display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap;">
                <select id="edit-folder" style="margin-bottom: 0; flex: 1; min-width: 120px;"></select>
                <button class="btn-outline" onclick="createNewFolder()" style="width: auto;">+ 새 폴더</button>
            </div>
            
            <input type="text" id="edit-title" placeholder="지문 제목">
            <div class="flex-row">
                <textarea id="edit-content" class="flex-1" rows="8" placeholder="문장을 로딩중입니다..."></textarea>
                <textarea id="edit-translation" class="flex-1" rows="8" placeholder="해석을 로딩중입니다..."></textarea>
            </div>

            <!-- [누락 해결] 모달창 내 빈출 문장 지정 패널 추가 -->
            <button class="btn-outline" style="width:100%; margin-top:10px; margin-bottom:10px; border-color:#eab308; color:#eab308;" onclick="buildHighlightPreview('edit-content', 'edit-highlight-preview')">⭐ 서술형 빈출 문장 지정 패널 새로고침</button>
            <div id="edit-highlight-preview" class="highlight-box" style="display:none;"></div>

            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeEditModal()">취소</button>
                <button class="btn-save" id="edit-submit-btn" onclick="submitEdit()">수정 내용 덮어쓰기</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="view-modal">
        <div class="card modal-box" style="max-width: 650px;">
            <h2 id="view-modal-title">📖 지문 상세보기</h2>
            <div id="view-modal-content" style="background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(0, 242, 254, 0.3); padding: 20px; border-radius: 8px; min-height: 150px; max-height: 400px; overflow-y: auto; white-space: pre-wrap; color: #e0f8ff; font-size: 14.5px; line-height: 1.7; margin-bottom: 15px; word-break: break-all;"></div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeViewModal()" style="background: #3b82f6; color: white; border: none; width: 100px;">닫기</button>
            </div>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyqzCO-zBDO1CmUNLklwNUKt4-OwLCMIiZLERtoqQMuNyKOSH5Di9SkWjbXQy5ie4Xc/exec";
        
        const ADMIN_PASSWORD = "loveng090630";
        let isAdmin = false;
        let globalFolders = new Set(["미분류"]);
        window.folderItems = {}; 

        function toggleAdminMode() {
            if (isAdmin) {
                if(confirm("관리자 모드를 종료하시겠습니까?")) {
                    isAdmin = false;
                    sessionStorage.removeItem('admin_auth');
                    document.body.classList.remove('admin-mode');
                    alert("관리자 모드가 해제되었습니다.");
                }
                return;
            }
            const pwd = prompt("관리자 비밀번호를 입력하세요:");
            if (pwd === ADMIN_PASSWORD) {
                isAdmin = true;
                sessionStorage.setItem('admin_auth', 'true');
                document.body.classList.add('admin-mode');
                alert("관리자 모드가 활성화되었습니다.");
            } else if (pwd !== null) {
                alert("비밀번호가 일치하지 않습니다.");
            }
        }

        window.onload = async () => {
            if (sessionStorage.getItem('admin_auth') === 'true') {
                isAdmin = true;
                document.body.classList.add('admin-mode');
            }
            try {
                const res = await fetch(GAS_URL + "?action=list");
                const list = await res.json();
                const container = document.getElementById('passage-list');
                container.innerHTML = "";
                
                if(list.length === 0) {
                    container.innerHTML = "<p style='text-align:center;'>등록된 지문이 없습니다.</p>";
                    updateFolderDropdowns(); return;
                }

                const folders = {};
                list.forEach(item => {
                    const f = item.folder || "미분류";
                    globalFolders.add(f); 
                    if(!folders[f]) folders[f] = [];
                    folders[f].push(item);
                });
                
                window.folderItems = folders; 
                updateFolderDropdowns();

                let htmlStr = "";
                let folderIndex = 0;
                
                for (const [folderName, items] of Object.entries(folders)) {
                    const headerId = `folder-header-${folderIndex}`;
                    const contentId = `folder-content-${folderIndex}`;
                    
                    htmlStr += `
                        <div id="${headerId}" class="folder-header" onclick="toggleFolder('${headerId}', '${contentId}')">
                            <div style="display: flex; align-items: center; gap: 10px;">
                                <input type="checkbox" class="folder-select-all" data-target="${contentId}" onclick="toggleFolderSelectAll(event, this)">
                                <span>📂 ${folderName} <span style="font-size: 12px; color: #94a3b8;">(${items.length})</span></span>
                                ${folderName !== '미분류' ? `<span class="admin-only admin-only-inline" onclick="renameFolder(event, '${folderName}')" style="cursor:pointer; margin-left:5px;">✏️</span>` : ''}
                            </div>
                            <span class="toggle-icon">▼</span>
                        </div>
                        <div id="${contentId}" class="folder-content">
                    `;
                    items.forEach(item => {
                        htmlStr += `
                            <div class="passage-row" data-id="${item.id}">
                                <input type="checkbox" class="chk-item" value="${item.id}">
                                <span class="passage-title" onclick="openViewModal('${item.id}')">${item.title}</span>
                                
                                <div class="input-group">
                                    <div class="mode-count">
                                        <input type="number" class="order-cnt" value="1" min="0" title="순서배열">
                                        <input type="number" class="insert-cnt" value="1" min="0" title="문장삽입">
                                        <input type="number" class="desc1-cnt" value="0" min="0" title="단어배열">
                                        <input type="number" class="desc2-cnt" value="0" min="0" title="어형변형">
                                        <input type="number" class="desc3-cnt" value="0" min="0" title="통문장영작">
                                    </div>
                                    <div class="mode-all">
                                        <input type="checkbox" class="order-all" title="순서배열(1문제)">
                                        <input type="checkbox" class="insert-all" title="문장삽입(전체)">
                                        <input type="checkbox" class="desc1-all" title="단어배열(전체)">
                                        <input type="checkbox" class="desc2-all" title="어형변형(전체)">
                                        <input type="checkbox" class="desc3-all" title="통문장영작(전체)">
                                    </div>
                                </div>

                                <div class="btn-group admin-only admin-only-flex">
                                    <button class="btn-sm btn-edit" onclick="openEditModal('${item.id}')">수정</button>
                                    <button class="btn-sm btn-del" onclick="deletePassage('${item.id}')">삭제</button>
                                </div>
                                <div class="move-btn-group admin-only admin-only-flex">
                                    <button class="btn-move" onclick="moveRow(this, -1)">▲</button>
                                    <button class="btn-move" onclick="moveRow(this, 1)">▼</button>
                                </div>
                            </div>`;
                    });
                    htmlStr += `</div>`;
                    folderIndex++;
                }
                container.innerHTML = htmlStr;
                toggleOutputMode(); 
            } catch (err) {
                document.getElementById('passage-list').innerHTML = "<p style='color:#ffb199;'>서버 통신 오류가 발생했습니다.</p>";
            }
        };

        function buildHighlightPreview(sourceId, previewId, existingHighlights = []) {
            const text = document.getElementById(sourceId).value;
            const sents = text.split('\n').map(s=>s.trim()).filter(s=>s!=="");
            const box = document.getElementById(previewId);
            box.innerHTML = '';
            
            if(sents.length === 0) {
                box.style.display = 'none';
                alert("먼저 영어 지문을 입력해주세요.");
                return;
            }
            
            box.style.display = 'flex';
            box.innerHTML = `<p style="font-size:12px; color:#fde047; margin:0 0 5px 0;">⭐ 서술형으로 자주 출제되는 문장을 클릭하여 하이라이트 지정하세요.</p>`;
            sents.forEach((s, i) => {
                const div = document.createElement('div');
                div.className = 'highlight-item';
                if(existingHighlights[i]) div.classList.add('active'); 
                div.innerText = `[${i+1}] ${s}`;
                div.onclick = function() { this.classList.toggle('active'); };
                box.appendChild(div);
            });
        }

        function toggleOutputMode() {
            const isAllMode = document.querySelector('input[name="output_mode"]:checked').value === 'all';
            document.querySelectorAll('.mode-count').forEach(el => el.style.display = isAllMode ? 'none' : 'flex');
            document.querySelectorAll('.mode-all').forEach(el => el.style.display = isAllMode ? 'flex' : 'none');
            document.getElementById('batch-count-panel').style.display = isAllMode ? 'none' : 'flex';
            document.getElementById('batch-all-panel').style.display = isAllMode ? 'flex' : 'none';
        }

        function applyGlobalCount() {
            const order = document.getElementById('global-order').value;
            const ins = document.getElementById('global-insert').value;
            const d1 = document.getElementById('global-desc1').value;
            const d2 = document.getElementById('global-desc2').value;
            const d3 = document.getElementById('global-desc3').value;
            document.querySelectorAll('.passage-row').forEach(row => {
                const i_ord = row.querySelector('.order-cnt'); if(i_ord) i_ord.value = order;
                const i_ins = row.querySelector('.insert-cnt'); if(i_ins) i_ins.value = ins;
                const i_d1 = row.querySelector('.desc1-cnt'); if(i_d1) i_d1.value = d1;
                const i_d2 = row.querySelector('.desc2-cnt'); if(i_d2) i_d2.value = d2;
                const i_d3 = row.querySelector('.desc3-cnt'); if(i_d3) i_d3.value = d3;
            });
        }

        function applyGlobalAll() {
            const o = document.getElementById('global-order-all').checked;
            const i = document.getElementById('global-insert-all').checked;
            const d1 = document.getElementById('global-desc1-all').checked;
            const d2 = document.getElementById('global-desc2-all').checked;
            const d3 = document.getElementById('global-desc3-all').checked;
            document.querySelectorAll('.passage-row').forEach(row => {
                const c_o = row.querySelector('.order-all'); if(c_o) c_o.checked = o;
                const c_i = row.querySelector('.insert-all'); if(c_i) c_i.checked = i;
                const c_d1 = row.querySelector('.desc1-all'); if(c_d1) c_d1.checked = d1;
                const c_d2 = row.querySelector('.desc2-all'); if(c_d2) c_d2.checked = d2;
                const c_d3 = row.querySelector('.desc3-all'); if(c_d3) c_d3.checked = d3;
            });
        }

        function moveRow(btn, direction) {
            const row = btn.closest('.passage-row');
            const parent = row.parentNode;
            if (direction === -1 && row.previousElementSibling) parent.insertBefore(row, row.previousElementSibling);
            else if (direction === 1 && row.nextElementSibling) parent.insertBefore(row.nextElementSibling, row);
            row.style.background = 'rgba(0, 242, 254, 0.2)';
            setTimeout(() => { row.style.background = 'rgba(0,0,0,0.15)'; }, 300);
        }

        async function saveCurrentOrder() {
            const orderedIds = [];
            document.querySelectorAll('.passage-row').forEach(row => {
                const id = row.getAttribute('data-id');
                if (id) orderedIds.push(id);
            });
            if (orderedIds.length === 0) return;
            const saveBtn = document.getElementById('save-order-btn');
            saveBtn.disabled = true;
            try {
                await fetch(GAS_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "reorder_passages", orderedIds: orderedIds }) });
                alert("순서가 고정되었습니다!"); location.reload();
            } catch(e) { alert("저장 오류"); }
        }

        async function renameFolder(event, oldFolderName) {
            event.stopPropagation(); 
            if (oldFolderName === "미분류") return alert("수정 불가");
            const newName = prompt(`새 이름을 입력하세요:`, oldFolderName);
            if (!newName || newName.trim() === "" || newName.trim() === oldFolderName) return;
            const items = window.folderItems[oldFolderName];
            if (!items) return;
            const idsToUpdate = items.map(item => item.id);
            try {
                await fetch(GAS_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "update_folder", ids: idsToUpdate, folder: newName.trim() }) });
                location.reload();
            } catch (e) { alert("오류 발생"); }
        }

        async function openViewModal(id) {
            document.getElementById('view-modal').style.display = 'flex';
            document.getElementById('view-modal-title').innerText = "로딩 중... 📄";
            document.getElementById('view-modal-content').innerText = "가져오고 있습니다...";
            try {
                const res = await fetch(GAS_URL + "?action=get_passage&id=" + id);
                const data = await res.json();
                document.getElementById('view-modal-title').innerText = `📖 ${data.title}`;
                let combinedStr = "";
                let sents = data.content.split('\n');
                let trans = data.translation ? data.translation.split('\n') : [];
                for(let i=0; i<sents.length; i++){
                    combinedStr += `[${i+1}] ${sents[i]}\n`;
                    if(trans[i]) combinedStr += `    ↳ ${trans[i]}\n`;
                    combinedStr += `\n`;
                }
                document.getElementById('view-modal-content').innerText = combinedStr;
            } catch(e) { document.getElementById('view-modal-content').innerText = "불러오기 실패"; }
        }

        function closeViewModal() { document.getElementById('view-modal').style.display = 'none'; }

        function toggleFolder(headerId, contentId) {
            const header = document.getElementById(headerId);
            const content = document.getElementById(contentId);
            if (content.style.display === "none") { content.style.display = "block"; header.classList.remove("collapsed"); } 
            else { content.style.display = "none"; header.classList.add("collapsed"); }
        }

        function toggleFolderSelectAll(event, checkbox) {
            event.stopPropagation(); 
            const contentDiv = document.getElementById(checkbox.getAttribute('data-target'));
            contentDiv.querySelectorAll('.chk-item').forEach(chk => chk.checked = checkbox.checked);
        }

        function updateFolderDropdowns() {
            const selects = [document.getElementById('folder'), document.getElementById('bulk-folder'), document.getElementById('edit-folder')];
            selects.forEach(sel => {
                const currentVal = sel.value; sel.innerHTML = "";
                globalFolders.forEach(f => {
                    const opt = document.createElement('option'); opt.value = f; opt.text = f; sel.appendChild(opt);
                });
                if(globalFolders.has(currentVal)) { sel.value = currentVal; }
            });
        }

        function createNewFolder() {
            const fName = prompt("새로운 폴더 이름을 입력하세요:");
            if (fName && fName.trim() !== "") {
                const cleanName = fName.trim(); globalFolders.add(cleanName); updateFolderDropdowns();
                document.getElementById('folder').value = cleanName;
            }
        }

        function toggleSelectAll() {
            const isChecked = document.getElementById('select-all').checked;
            document.querySelectorAll('.chk-item').forEach(chk => chk.checked = isChecked);
            document.querySelectorAll('.folder-select-all').forEach(chk => chk.checked = isChecked);
        }

        async function moveSelectedToFolder() {
            const folder = document.getElementById('bulk-folder').value;
            const selected = Array.from(document.querySelectorAll('.chk-item:checked')).map(chk => chk.value);
            if(selected.length === 0) return alert("선택된 지문이 없습니다.");
            try {
                await fetch(GAS_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "update_folder", ids: selected, folder: folder }) });
                location.reload();
            } catch (e) { alert("이동 오류"); }
        }

        async function saveToDB() {
            const title = document.getElementById('title').value;
            const content = document.getElementById('content').value;
            const translation = document.getElementById('translation').value;
            const folder = document.getElementById('folder').value;
            
            const box = document.getElementById('highlight-preview');
            let highlights = [];
            if(box.style.display !== 'none') {
                highlights = Array.from(box.querySelectorAll('.highlight-item')).map(el => el.classList.contains('active'));
            }

            if(!title || !content) return alert("제목과 내용을 입력해주세요.");
            
            const saveBtn = document.getElementById('save-btn');
            saveBtn.innerText = "업로드 중..."; saveBtn.disabled = true;
            try {
                await fetch(GAS_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "save", title, content, translation, folder, highlights }) });
                location.reload(); 
            } catch (e) { alert("저장 오류"); saveBtn.innerText = "DB에 업로드하기"; saveBtn.disabled = false; }
        }

        async function deletePassage(id) {
            if(!confirm("삭제하시겠습니까?")) return;
            await fetch(GAS_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "delete", id: id }) });
            location.reload();
        }

        async function openEditModal(id) {
            document.getElementById('edit-modal').style.display = 'flex';
            document.getElementById('edit-id').value = id;
            try {
                const res = await fetch(GAS_URL + "?action=get_passage&id=" + id);
                const data = await res.json();
                if(data.folder && !globalFolders.has(data.folder)) { globalFolders.add(data.folder); updateFolderDropdowns(); }
                document.getElementById('edit-title').value = data.title;
                document.getElementById('edit-folder').value = data.folder || "미분류";
                document.getElementById('edit-content').value = data.content;
                document.getElementById('edit-translation').value = data.translation || "";
                
                buildHighlightPreview('edit-content', 'edit-highlight-preview', data.highlights || []);
            } catch(e) { }
        }

        function closeEditModal() { document.getElementById('edit-modal').style.display = 'none'; }

        async function submitEdit() {
            const id = document.getElementById('edit-id').value;
            const title = document.getElementById('edit-title').value;
            const folder = document.getElementById('edit-folder').value;
            const content = document.getElementById('edit-content').value;
            const trans = document.getElementById('edit-translation').value;
            
            const box = document.getElementById('edit-highlight-preview');
            let highlights = [];
            if(box.style.display !== 'none') {
                highlights = Array.from(box.querySelectorAll('.highlight-item')).map(el => el.classList.contains('active'));
            }

            if(!title || !content) return;
            document.getElementById('edit-submit-btn').disabled = true;
            try {
                await fetch(GAS_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "update", id, title, content, translation: trans, folder, highlights }) });
                location.reload();
            } catch (e) { document.getElementById('edit-submit-btn').disabled = false; }
        }

        function checkAnswer(btn) {
            const input = btn.previousElementSibling;
            const userAnswer = input.value.trim().toLowerCase().replace(/[.,?!]/g, "").replace(/\s+/g, " ");
            let rawAnswer = "";
            try { rawAnswer = decodeURIComponent(escape(atob(input.getAttribute('data-answer')))); } catch(e) { rawAnswer = atob(input.getAttribute('data-answer')); }
            const correctAnswer = rawAnswer.trim().toLowerCase().replace(/[.,?!]/g, "").replace(/\s+/g, " ");
            let mark = input.parentElement.querySelector('.result-mark');
            if(!mark) { mark = document.createElement('span'); mark.className = 'result-mark'; input.parentElement.appendChild(mark); }
            
            if (userAnswer === correctAnswer) {
                mark.innerText = "⭕ 정답입니다!"; mark.style.color = "#4ade80";
            } else {
                mark.innerText = "❌ 오답입니다. (정답: " + rawAnswer + ")"; mark.style.color = "#f87171";
            }
        }

        async function generateIntegratedQuiz() {
            const isAllMode = document.querySelector('input[name="output_mode"]:checked').value === 'all';
            const onlyHighlight = document.getElementById('only-highlight-gen').checked; 
            const selected = [];
            
            document.querySelectorAll('.passage-row').forEach(row => {
                const chk = row.querySelector('.chk-item');
                if(chk && chk.checked) {
                    let order, insert, desc1, desc2, desc3;
                    if (isAllMode) {
                        order = row.querySelector('.order-all').checked ? "ALL" : 0;
                        insert = row.querySelector('.insert-all').checked ? "ALL" : 0;
                        desc1 = row.querySelector('.desc1-all').checked ? "ALL" : 0;
                        desc2 = row.querySelector('.desc2-all').checked ? "ALL" : 0;
                        desc3 = row.querySelector('.desc3-all').checked ? "ALL" : 0;
                    } else {
                        order = parseInt(row.querySelector('.order-cnt').value) || 0;
                        insert = parseInt(row.querySelector('.insert-cnt').value) || 0;
                        desc1 = parseInt(row.querySelector('.desc1-cnt').value) || 0;
                        desc2 = parseInt(row.querySelector('.desc2-cnt').value) || 0;
                        desc3 = parseInt(row.querySelector('.desc3-cnt').value) || 0;
                    }
                    if(order !== 0 || insert !== 0 || desc1 !== 0 || desc2 !== 0 || desc3 !== 0) {
                        selected.push({ id: chk.value, order, insert, desc1, desc2, desc3 });
                    }
                }
            });
            
            if(selected.length === 0) return alert("출제할 지문과 문항 수를 선택해주세요.");

            const quizDiv = document.getElementById('quiz-output');
            quizDiv.innerHTML = "<h3 style='text-align:center;'>AI가 문제를 생성하고 있습니다...<br>※ API 호출 시 최대 10~15초 소요될 수 있습니다 ⚙️</h3>";
            quizDiv.style.display = "block";
            const btn = document.getElementById('gen-btn');
            btn.disabled = true;

            const mainTitle = document.getElementById('custom-main-title').value;

            try {
                const res = await fetch(GAS_URL, { 
                    method: "POST", 
                    headers: { "Content-Type": "text/plain;charset=utf-8" }, 
                    body: JSON.stringify({ action: "generate_batch", passages: selected, mainTitle: mainTitle, onlyHighlight: onlyHighlight }) 
                });
                const result = await res.json();
                
                if (result.status === "error") {
                     quizDiv.innerHTML = `<p style='color:red;'>서버 처리 중 오류가 발생했습니다: ${result.message}</p>`;
                     return;
                }

                quizDiv.innerHTML = result.html_content;
                document.getElementById('pdf-btn').style.display = "block";
            } catch(e) {
                quizDiv.innerHTML = "<p style='color:red;'>네트워크 또는 시스템 오류가 발생했습니다.</p>";
            } finally {
                btn.disabled = false;
            }
        }

        function downloadPDF() {
            window.scrollTo(0, 0); 
            let titleInput = document.getElementById('custom-main-title').value.trim();
            let fileName = titleInput ? titleInput + '.pdf' : '영어_지문_변형_문제.pdf';
            let element = document.getElementById('quiz-output');
            
            let currentScale = 2; 
            if (element.clientHeight > 15000) currentScale = 1;
            else if (element.clientHeight > 8000) currentScale = 1.5;
            
            html2pdf().set({ 
                margin: [15, 15, 15, 15], 
                filename: fileName, 
                image: { type: 'jpeg', quality: 0.95 },
                html2canvas: { scale: currentScale, useCORS: true }, 
                jsPDF: { format: 'a4', orientation: 'portrait' },
                pagebreak: { mode: ['css', 'legacy'] }
            }).from(element).save();
        }
    </script>
</body>
</html>
